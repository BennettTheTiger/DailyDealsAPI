version: "3.9"

# Atlas-only deployment for the Pi/home host.
# The app connects directly to MongoDB Atlas and does not run a local MongoDB container.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dailydeals-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      RUN_SERVER: ${RUN_SERVER:-true}
      RUN_SCRAPER: ${RUN_SCRAPER:-false}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY}
    ports:
      - "3000:3000"
