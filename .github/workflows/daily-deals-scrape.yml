name: Daily Deals Scrape

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run scrape job
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: daily_deals
          MONGODB_COLLECTION: deals
        run: |
          npm run scrape | tee scrape-output.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('scrape-output.json','utf8')); console.log('Summary: ' + x.success + ' | retailers=' + x.totalRetailers + ' | deals=' + x.dealCount + ' | persisted=' + x.persistedCount + ' | savedToMongo=' + x.savedToMongo);"
